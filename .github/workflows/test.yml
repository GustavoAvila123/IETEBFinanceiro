name: Tests

# Roda em push e PR pra DEV ou MASTER (PROD).
# Bloqueia merge pra master se Vitest ou ESLint falharem.
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Vitest unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # E2E é pesado (browser, ~50s). Roda em PR ou push pra master
    # (cobertura de release). Em dev, só rola se for PR — commits
    # diários ficam mais ágeis.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e
